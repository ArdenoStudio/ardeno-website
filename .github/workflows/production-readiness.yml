name: Production Readiness

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      live_url:
        description: "Live URL to verify after deployment"
        required: false
        default: "https://www.ardenostudio.online"

permissions:
  contents: read

concurrency:
  group: production-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-gates:
    name: Local Production Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: API security tests
        run: npm run test:api

      - name: Production build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Secret scan
        run: npm run scan:secrets

  live-verify:
    name: Live Production Verification
    runs-on: ubuntu-latest
    needs: local-gates
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify live production
        run: node scripts/verify-production.mjs "${{ inputs.live_url }}"
